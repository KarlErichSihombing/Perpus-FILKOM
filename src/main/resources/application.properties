spring.application.name=contoh-daftar-buku

# Platform hosting memberi nomor port lewat variabel PORT; lokal tetap 8080
server.port=${PORT:8080}

# Database H2 in-memory (hilang saat aplikasi dimatikan)
spring.datasource.url=jdbc:h2:mem:perpustakaan
spring.datasource.username=sa
spring.datasource.password=
# H2 console aktif di lokal; di server isi H2_CONSOLE=false supaya tidak terbuka untuk umum
spring.h2.console.enabled=${H2_CONSOLE:true}

# Tabel dibuat otomatis dari @Entity, lalu data.sql dijalankan
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
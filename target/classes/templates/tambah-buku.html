<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Buku</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <span class="brand">Perpustakaan FILKOM</span>
        <nav class="nav">
            <a th:href="@{/buku}" class="active">Buku</a>
            <a th:href="@{/pinjam}">Pinjam</a>
            <a th:href="@{/anggota}">Anggota</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Tambah buku</h1>
    <p class="subtitle">Isi data buku baru, lalu simpan.</p>

    <div class="alert" th:if="${pesan}" role="alert" th:text="${pesan}">Pesan error</div>

    <form class="form-card" th:action="@{/buku}" method="post">
        <div class="field">
            <label for="idBuku">ID buku</label>
            <input id="idBuku" name="idBuku" placeholder="Contoh: B004" maxlength="10" required>
        </div>
        <div class="field">
            <label for="judul">Judul</label>
            <input id="judul" name="judul" placeholder="Judul buku" maxlength="200" required>
        </div>
        <div class="field">
            <label for="stok">Stok</label>
            <input id="stok" name="stok" type="number" min="0" value="1">
        </div>
        <div class="form-actions">
            <a class="btn btn-ghost" th:href="@{/buku}">Batal</a>
            <button type="submit" class="btn">Simpan</button>
        </div>
    </form>
</main>
</body>
</html>

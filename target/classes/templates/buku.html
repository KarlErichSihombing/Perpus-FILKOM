<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Buku</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <span class="brand">Perpustakaan FILKOM</span>
        <nav class="nav">
            <a th:href="@{/buku}" class="active">Buku</a>
            <a th:href="@{/pinjam}">Pinjam</a>
            <a th:href="@{/anggota}">Anggota</a>
        </nav>
    </div>
</header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>Daftar buku</h1>
            <p class="subtitle">Semua buku yang ada di perpustakaan.</p>
        </div>
        <div class="actions">
            <a class="btn" th:href="@{/buku/tambah}">Tambah buku</a>
            <a class="btn btn-ghost" th:href="@{/pinjam}">Pinjam buku</a>
            <a class="btn btn-ghost" th:href="@{/anggota}">Lihat anggota</a>
        </div>
    </div>

    <div class="list">
        <div class="book" th:each="b : ${daftarBuku}">
            <div>
                <div class="book-title" th:text="${b.judul}">Judul buku</div>
                <div class="book-meta" th:text="${b.idBuku}">B001</div>
            </div>
            <span class="badge"
                  th:classappend="${b.stok == 0} ? 'badge-bad' : (${b.stok <= 2} ? 'badge-warn' : 'badge-ok')"
                  th:text="${b.stok == 0} ? 'Habis' : ${b.stok} + ' tersedia'">3 tersedia</span>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(daftarBuku)}">Belum ada buku. Klik "Tambah buku" untuk mulai.</p>
    </div>
</main>
</body>
</html>
